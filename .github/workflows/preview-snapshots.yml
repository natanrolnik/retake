name: Preview snapshots

# Example of consuming the action. Copy this into a repository that uses Tuist and
# adjust the inputs; nothing else in that repository has to change.
on:
  pull_request:
    branches: [main]

concurrency:
  # A superseded push has nothing useful left to say, and macOS minutes are expensive.
  group: preview-snapshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snapshots:
    runs-on: macos-15
    permissions:
      contents: read
      pull-requests: write
      # Lets the job mint a short lived OIDC token, which is exchanged for AWS
      # credentials. Without this there is no token to exchange.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The action diffs against the merge base, so it needs the history to find it.
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The action requires Tuist rather than installing it, so that the version stays
      # the one this repository pins.
      - uses: jdx/mise-action@v2

      # No stored access key: the role is assumed with a token minted for this run, and
      # the credentials it returns expire with the job. The role trusts only this
      # repository, and can write nothing but this bucket's retake/ prefix.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::949110043038:role/flexview-ci
          aws-region: us-east-1

      - uses: ./
        with:
          working-directory: Fixtures/SampleApp
          simulator: iPhone 17
          deployment-target: '17.0'
          # Off by default: it costs about two seconds per preview. Turn it on for
          # modules whose previews load content asynchronously, which
          # `retake verify` will tell you.
          settle: 'false'
          # The bucket blocks all public access; each URL carries its own signature and
          # lasts a day, so images in an older comment eventually stop loading.
          s3-bucket: flexview-preview-snapshots
          s3-region: us-east-1
          s3-url-mode: presigned
          s3-presign-expires: '86400'
