name: retake preview snapshots
description: Render the SwiftUI previews a pull request affects, and report what changed visually.
author: Natan Rolnik

inputs:
  modules:
    description: Modules to render, space separated. Derived from the changed files when empty.
    required: false
    default: ''
  simulator:
    description: Simulator to render on, as 'name,OS'. The runner's newest available iPhone when empty.
    required: false
    default: ''
  deployment-target:
    description: iOS deployment target for the generated host project.
    required: false
    default: '17.0'
  settle:
    description: Wait for asynchronously loaded content before capturing. Slower, but required for previews whose content arrives late.
    required: false
    default: 'false'
  tolerance:
    description: Changed-pixel percentage at or below which a preview counts as unchanged. Below roughly 0.1% is renderer jitter rather than a change.
    required: false
    default: '0.1'
  verify:
    description: Render head twice and exclude previews that do not reproduce.
    required: false
    default: 'true'
  hosts:
    description: App targets allowed to host the previews, space separated. Without this every app in scope is used, which is rarely wanted when the repository has per-module preview apps.
    required: false
    default: ''
  ignore:
    description: Glob patterns, relative to the repository, for files that cannot affect rendering. A single unowned file otherwise widens the scope to everything.
    required: false
    default: '.github/** *.md **/*.md docs/**'
  verbose-build:
    description: Skip xcbeautify and keep the raw xcodebuild log. Verbose, but xcbeautify drops the render's own output, which is where a failure explains itself.
    required: false
    default: 'false'
  cache-profile:
    description: Tuist binary cache profile for the generated host (only-external, all-possible, none, or a custom profile). Reuses prebuilt binaries instead of compiling dependencies from source.
    required: false
    default: ''
  warm-cache:
    description: Run `tuist cache` for the targets retake is about to render, before rendering them. Turns a from-source build of those modules into a download.
    required: false
    default: 'false'
  working-directory:
    description: Path to the Tuist repository to review.
    required: false
    default: '.'
  retake-version:
    description: >-
      Released version of retake to install. Defaults to the version this action ships
      with, which the release workflow checks against the tag.
    required: false
    default: '0.7.0'
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: 'retake-report'
  s3-bucket:
    description: Bucket to upload images to. Without it the report is artifact-only and the comment links to it instead of showing images.
    required: false
    default: ''
  s3-region:
    description: Region of the bucket.
    required: false
    default: 'us-east-1'
  s3-prefix:
    description: Key prefix for everything retake uploads.
    required: false
    default: 'retake'
  s3-url-mode:
    description: How uploaded objects are addressed. public = world readable bucket URL; cdn = served through s3-public-base-url; presigned = bucket stays private and each URL carries a time-limited signature.
    required: false
    default: 'public'
  s3-presign-expires:
    description: Lifetime of presigned URLs in seconds, with s3-url-mode presigned. AWS caps this at 7 days, after which images in older comments stop loading.
    required: false
    default: '86400'
  s3-endpoint:
    description: Endpoint for an S3-compatible service. Omit for AWS.
    required: false
    default: ''
  s3-public-base-url:
    description: Base URL objects are served from with s3-url-mode cdn (a CDN or custom domain in front of the bucket).
    required: false
    default: ''
  comment:
    description: Upsert a pull request comment. Skipped automatically when the token cannot write.
    required: false
    default: 'true'
  token:
    description: Token used to comment. Needs pull-requests write.
    required: false
    default: ${{ github.token }}

outputs:
  report:
    description: Path to the generated HTML report.
    value: ${{ steps.review.outputs.report }}
  report-json:
    description: Path to report.json, the machine readable form of the same run.
    value: ${{ steps.review.outputs.report-json }}
  report-url:
    description: Published URL of the HTML report. Empty unless s3-bucket is set.
    value: ${{ steps.review.outputs.report-url }}
  summary:
    description: One-line summary, e.g. "3 changed · 1 new · 0 removed · 2 unstable".
    value: ${{ steps.review.outputs.summary }}
  changed:
    description: Number of previews whose rendering changed.
    value: ${{ steps.review.outputs.changed }}
  new:
    description: Number of previews that did not exist on the base.
    value: ${{ steps.review.outputs.new }}
  removed:
    description: Number of previews that existed on the base and no longer render.
    value: ${{ steps.review.outputs.removed }}
  unchanged:
    description: Number of previews that rendered identically.
    value: ${{ steps.review.outputs.unchanged }}
  unstable:
    description: >
      Number of previews excluded because they did not reproduce on the same commit.
      Only ever non-zero when verify is on. A real change can hide in here, so it is
      worth surfacing rather than treating as noise.
    value: ${{ steps.review.outputs.unstable }}
  failures:
    description: Number of previews that failed to render at all.
    value: ${{ steps.review.outputs.failures }}
  total:
    description: Number of previews compared, across every bucket.
    value: ${{ steps.review.outputs.total }}
  has-changes:
    description: >
      'true' when anything changed, was added or was removed. The one output most
      workflows want, so a later step can gate on it without parsing numbers.
    value: ${{ steps.review.outputs.has-changes }}

runs:
  using: composite
  steps:
    # Installed from a release rather than built here: the tarball carries the binary
    # and the runtime sources it compiles into the generated host project, so nothing is
    # compiled on the runner and the version is whatever the tag says.
    - name: Install retake
      id: retake
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v mise >/dev/null 2>&1; then
          echo "::error::mise is not on PATH. Add jdx/mise-action before this step."
          exit 1
        fi
        # The default is the version this action ships with, checked against the tag by
        # the release workflow. github.action_ref would be the obvious source and is
        # empty inside a composite action, which silently fell back to "latest".
        VERSION="${{ inputs.retake-version }}"
        echo "Installing retake $VERSION"
        # mise hides releases newer than its minimum_release_age, so "latest" resolves to
        # nothing for a tag published minutes ago. Pinning a version is unaffected.
        mise use -g "github:natanrolnik/retake@$VERSION"
        RETAKE="$(mise which retake)"
        echo "bin=$RETAKE" >> "$GITHUB_OUTPUT"
        # The runtime ships beside the binary, at <prefix>/runtime.
        echo "runtime=$(cd "$(dirname "$RETAKE")/.." && pwd)/runtime" >> "$GITHUB_OUTPUT"
        "$RETAKE" --help > /dev/null

    # Booting a simulator on a cold runner takes minutes, and it is the largest single
    # cost in this job. Started as early as it can be, which is once retake can say which
    # simulator it would use: booting a different one than the render uses buys nothing.
    - name: Warm the simulator
      shell: bash
      run: |
        set -euo pipefail
        DEVICE="${{ inputs.simulator }}"
        DEVICE="${DEVICE%%,*}"
        [ -z "$DEVICE" ] && DEVICE="$("${{ steps.retake.outputs.bin }}" simulator --name-only)"
        echo "Booting $DEVICE in the background"
        xcrun simctl boot "$DEVICE" >/dev/null 2>&1 || true

    # Deliberately not installed here. The repository pins its own Tuist version, and a
    # different one can produce a graph that disagrees with the project, so the caller
    # installs it the same way it does for every other job.
    - name: Resolve Tuist
      id: tuist
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if ! command -v tuist >/dev/null 2>&1; then
          echo "::error::tuist is not on PATH. Install it before this step, for example with jdx/mise-action or tuist/setup-tuist, using the version this repository pins."
          exit 1
        fi
        # Prefer running through mise where it manages tuist, so the pinned version is
        # the one used.
        if command -v mise >/dev/null 2>&1 && mise which tuist >/dev/null 2>&1; then
          echo "command=mise exec -- tuist" >> "$GITHUB_OUTPUT"
        else
          echo "command=tuist" >> "$GITHUB_OUTPUT"
        fi
        tuist version

    # Not a requirement: retake falls back to a raw xcodebuild log without it.
    - name: Install xcbeautify
      shell: bash
      run: |
        if ! command -v xcbeautify >/dev/null 2>&1; then
          brew install xcbeautify || echo "::warning::xcbeautify unavailable; the build log will be verbose."
        fi

    # The base is the expensive half and rarely changes within a pull request, so it is
    # cached on the merge base. Without this every push pays for two full builds.
    - name: Restore the base render
      id: base-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/retake/base
        key: retake-base-${{ runner.os }}-${{ github.event.pull_request.base.sha }}-${{ inputs.simulator }}-${{ inputs.settle }}

    - name: Render and compare
      id: review
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Globbing off: the ignore patterns are globs for retake to match, and the shell
        # would expand them against the working directory first, turning ".github/**"
        # into a literal path that matches nothing.
        set -euof pipefail
        OUT="${{ runner.temp }}/retake"
        RETAKE="${{ steps.retake.outputs.bin }}"

        ARGS=(
          review
          --repo .
          --base "${{ github.event.pull_request.base.sha }}"
          --out "$OUT"
          --tolerance "${{ inputs.tolerance }}"
          --deployment-target "${{ inputs.deployment-target }}"
          --runtime-sources "${{ steps.retake.outputs.runtime }}"
          --html "$OUT/report.html"
          --tuist "${{ steps.tuist.outputs.command }}"
          # A pull request is its commits. Steps before this one, tuist install among
          # them, rewrite tracked files, and those are not part of the change.
          --no-uncommitted
        )
        [ -n "${{ inputs.simulator }}" ] && ARGS+=(--simulator "${{ inputs.simulator }}")
        [ -n "${{ inputs.modules }}" ] && ARGS+=(--modules ${{ inputs.modules }})
        [ -n "${{ inputs.hosts }}" ] && ARGS+=(--hosts ${{ inputs.hosts }})
        [ -n "${{ inputs.ignore }}" ] && ARGS+=(--ignore ${{ inputs.ignore }})
        [ -n "${{ inputs.cache-profile }}" ] && ARGS+=(--cache-profile "${{ inputs.cache-profile }}")
        [ "${{ inputs.settle }}" = "true" ] && ARGS+=(--settle)
        [ "${{ inputs.warm-cache }}" = "true" ] && ARGS+=(--warm-cache)
        [ "${{ inputs.verbose-build }}" = "true" ] && ARGS+=(--no-pretty)
        [ "${{ inputs.verify }}" = "true" ] && ARGS+=(--verify)
        [ "${{ steps.base-cache.outputs.cache-hit }}" = "true" ] && ARGS+=(--reuse-base)

        "$RETAKE" "${ARGS[@]}"

        echo "report=$OUT/report.html" >> "$GITHUB_OUTPUT"

        # Images have to live somewhere with a public URL for a comment to show them:
        # a workflow artifact is a zip behind auth and cannot be linked to.
        if [ -n "${{ inputs.s3-bucket }}" ]; then
          PUBLISH=(
            publish
            --report "$OUT/diff/report.json"
            --bucket "${{ inputs.s3-bucket }}"
            --region "${{ inputs.s3-region }}"
            --prefix "${{ inputs.s3-prefix }}"
            --repository "$GITHUB_REPOSITORY"
            --commit "${{ github.event.pull_request.head.sha }}"
            --html "$OUT/report.html"
            --url-mode "${{ inputs.s3-url-mode }}"
            --presign-expires "${{ inputs.s3-presign-expires }}"
          )
          [ -n "${{ github.event.pull_request.number }}" ] && PUBLISH+=(--pr "${{ github.event.pull_request.number }}")
          [ -n "${{ inputs.s3-endpoint }}" ] && PUBLISH+=(--endpoint "${{ inputs.s3-endpoint }}")
          [ -n "${{ inputs.s3-public-base-url }}" ] && PUBLISH+=(--public-base-url "${{ inputs.s3-public-base-url }}")
          "$RETAKE" "${PUBLISH[@]}"
        fi

        "$RETAKE" comment \
          --report "$OUT/diff/report.json" \
          --artifact-name "${{ inputs.artifact-name }}" \
          --artifact-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --out "$OUT/comment.md"

        # The job summary is the version nobody has to download.
        cat "$OUT/comment.md" >> "$GITHUB_STEP_SUMMARY"

        # Counts for later steps, read after publishing so report-url is populated.
        # Parsed here rather than by a retake subcommand because this action installs a
        # released binary: a new command would not exist in the version it pins.
        # Never fatal — a workflow should not lose a finished render to a parsing slip.
        python3 - "$OUT/diff/report.json" >> "$GITHUB_OUTPUT" <<'PYEOF' || echo "::warning::could not read report.json; the count outputs are empty"
        import json, sys

        report = json.load(open(sys.argv[1]))
        previews = report.get("previews", [])
        counts = {}
        for preview in previews:
            change = preview.get("change", "unchanged")
            counts[change] = counts.get(change, 0) + 1

        # "added" and "new" name the same bucket; the output uses the word the report
        # prints, so what a workflow reads matches what a reviewer sees.
        changed = counts.get("changed", 0)
        added = counts.get("added", 0)
        removed = counts.get("removed", 0)
        unstable = counts.get("unstable", 0)
        unchanged = counts.get("unchanged", 0)
        failures = len(report.get("failures", []))

        summary = f"{changed} changed · {added} new · {removed} removed"
        if unstable:
            summary += f" · {unstable} unstable"

        for key, value in [
            ("changed", changed),
            ("new", added),
            ("removed", removed),
            ("unchanged", unchanged),
            ("unstable", unstable),
            ("failures", failures),
            ("total", len(previews)),
            ("has-changes", str(changed + added + removed > 0).lower()),
            ("summary", summary),
            ("report-json", sys.argv[1]),
            ("report-url", report.get("reportURL") or ""),
        ]:
            print(f"{key}={value}")
        PYEOF

    - name: Upload the report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ runner.temp }}/retake/report.html
          ${{ runner.temp }}/retake/diff/report.json
        if-no-files-found: warn

    # A pull request from a fork gets a read-only token, so commenting would fail. The
    # artifact and the job summary are still produced, which is why this only skips the
    # comment rather than failing the job.
    - name: Comment on the pull request
      if: >
        inputs.comment == 'true' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        "${{ steps.retake.outputs.bin }}" comment \
          --report "${{ runner.temp }}/retake/diff/report.json" \
          --pr "${{ github.event.pull_request.number }}" \
          --artifact-name "${{ inputs.artifact-name }}" \
          --artifact-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

    - name: Note skipped comment
      if: >
        inputs.comment == 'true' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository
      shell: bash
      run: |
        echo "::notice::Pull requests from forks get a read-only token, so no comment was posted. The report is attached as the '${{ inputs.artifact-name }}' artifact and repeated in this job's summary."
