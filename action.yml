name: flexview preview snapshots
description: Render the SwiftUI previews a pull request affects, and report what changed visually.
author: Natan Rolnik

inputs:
  modules:
    description: Modules to render, space separated. Derived from the changed files when empty.
    required: false
    default: ''
  simulator:
    description: Simulator to render on, as 'name,OS'. For example 'iPhone 17,26.0'.
    required: false
    default: ''
  deployment-target:
    description: iOS deployment target for the generated host project.
    required: false
    default: '17.0'
  settle:
    description: Wait for asynchronously loaded content before capturing. Slower, but required for previews whose content arrives late.
    required: false
    default: 'false'
  tolerance:
    description: Changed-pixel percentage at or below which a preview counts as unchanged.
    required: false
    default: '0.01'
  verify:
    description: Render head twice and exclude previews that do not reproduce.
    required: false
    default: 'true'
  working-directory:
    description: Path to the Tuist repository to review.
    required: false
    default: '.'
  flexview-ref:
    description: Ref of the flexview repository to build the tool from.
    required: false
    default: 'main'
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: 'flexview-report'
  s3-bucket:
    description: Bucket to upload images to. Without it the report is artifact-only and the comment links to it instead of showing images.
    required: false
    default: ''
  s3-region:
    description: Region of the bucket.
    required: false
    default: 'us-east-1'
  s3-prefix:
    description: Key prefix for everything flexview uploads.
    required: false
    default: 'flexview'
  s3-endpoint:
    description: Endpoint for an S3-compatible service. Omit for AWS.
    required: false
    default: ''
  s3-public-base-url:
    description: Base URL objects are served from, when that differs from the bucket URL (a CDN or custom domain).
    required: false
    default: ''
  comment:
    description: Upsert a pull request comment. Skipped automatically when the token cannot write.
    required: false
    default: 'true'
  token:
    description: Token used to comment. Needs pull-requests write.
    required: false
    default: ${{ github.token }}

outputs:
  report:
    description: Path to the generated HTML report.
    value: ${{ steps.review.outputs.report }}
  summary:
    description: One-line summary, e.g. "3 changed · 1 new · 0 removed".
    value: ${{ steps.review.outputs.summary }}

runs:
  using: composite
  steps:
    # Booting a simulator on a cold runner takes minutes, and it is the single largest
    # cost in this job. Started first so it happens while flexview and the project are
    # still building, rather than in silence after them.
    - name: Warm the simulator
      shell: bash
      run: |
        DEVICE="${{ inputs.simulator }}"
        DEVICE="${DEVICE%%,*}"
        [ -z "$DEVICE" ] && DEVICE="iPhone 17"
        echo "Booting $DEVICE in the background"
        xcrun simctl boot "$DEVICE" >/dev/null 2>&1 || true

    - name: Check out flexview
      uses: actions/checkout@v4
      with:
        repository: natanrolnik/flexview
        ref: ${{ inputs.flexview-ref }}
        path: .flexview-tool

    - name: Identify the toolchain and flexview revision
      id: tool
      shell: bash
      run: |
        echo "sha=$(git -C .flexview-tool rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        # The binary is toolchain specific, so a Swift upgrade must miss the cache. Keyed
        # on the selected Xcode rather than `swiftc --version`: the first invocation of a
        # Swift tool on a fresh runner triggers Xcode's first-launch setup, which took
        # minutes and is pure latency this early in the job. The path carries the version.
        echo "swift=$(xcode-select -p | tr -cd '[:alnum:].')" >> "$GITHUB_OUTPUT"

    # The binary is the thing worth caching: on a hit nothing is compiled at all. Keyed
    # on the exact flexview revision, so a new revision rebuilds and an unchanged one
    # never does.
    - name: Restore the flexview binary
      id: binary-cache
      uses: actions/cache@v4
      with:
        path: .flexview-tool/.build/debug/flexview
        key: flexview-bin-${{ runner.os }}-${{ steps.tool.outputs.swift }}-${{ steps.tool.outputs.sha }}

    # Only consulted when the binary is missing, to make that rebuild incremental rather
    # than from scratch.
    - name: Restore the flexview build directory
      if: steps.binary-cache.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: .flexview-tool/.build
        key: flexview-build-${{ runner.os }}-${{ steps.tool.outputs.swift }}-${{ hashFiles('.flexview-tool/Package.resolved') }}
        restore-keys: |
          flexview-build-${{ runner.os }}-${{ steps.tool.outputs.swift }}-
          flexview-build-${{ runner.os }}-

    - name: Build flexview
      if: steps.binary-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: .flexview-tool
      # Debug, not release: flexview only orchestrates xcodebuild and is I/O bound, so
      # optimisation buys nothing, while release mode recompiles a whole module for any
      # changed file and defeats the incremental restore below.
      run: swift build --product flexview

    # Deliberately not installed here. The repository pins its own Tuist version, and a
    # different one can produce a graph that disagrees with the project, so the caller
    # installs it the same way it does for every other job.
    - name: Resolve Tuist
      id: tuist
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if ! command -v tuist >/dev/null 2>&1; then
          echo "::error::tuist is not on PATH. Install it before this step, for example with jdx/mise-action or tuist/setup-tuist, using the version this repository pins."
          exit 1
        fi
        # Prefer running through mise where it manages tuist, so the pinned version is
        # the one used.
        if command -v mise >/dev/null 2>&1 && mise which tuist >/dev/null 2>&1; then
          echo "command=mise exec -- tuist" >> "$GITHUB_OUTPUT"
        else
          echo "command=tuist" >> "$GITHUB_OUTPUT"
        fi
        tuist version

    # Not a requirement: flexview falls back to a raw xcodebuild log without it.
    - name: Install xcbeautify
      shell: bash
      run: |
        if ! command -v xcbeautify >/dev/null 2>&1; then
          brew install xcbeautify || echo "::warning::xcbeautify unavailable; the build log will be verbose."
        fi

    # The base is the expensive half and rarely changes within a pull request, so it is
    # cached on the merge base. Without this every push pays for two full builds.
    - name: Restore the base render
      id: base-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/flexview/base
        key: flexview-base-${{ runner.os }}-${{ github.event.pull_request.base.sha }}-${{ inputs.simulator }}-${{ inputs.settle }}

    - name: Render and compare
      id: review
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        OUT="${{ runner.temp }}/flexview"
        TOOL="$GITHUB_WORKSPACE/.flexview-tool"

        ARGS=(
          review
          --repo .
          --base "${{ github.event.pull_request.base.sha }}"
          --out "$OUT"
          --tolerance "${{ inputs.tolerance }}"
          --deployment-target "${{ inputs.deployment-target }}"
          --runtime-sources "$TOOL"
          --html "$OUT/report.html"
          --tuist "${{ steps.tuist.outputs.command }}"
        )
        [ -n "${{ inputs.simulator }}" ] && ARGS+=(--simulator "${{ inputs.simulator }}")
        [ -n "${{ inputs.modules }}" ] && ARGS+=(--modules ${{ inputs.modules }})
        [ "${{ inputs.settle }}" = "true" ] && ARGS+=(--settle)
        [ "${{ inputs.verify }}" = "true" ] && ARGS+=(--verify)
        [ "${{ steps.base-cache.outputs.cache-hit }}" = "true" ] && ARGS+=(--reuse-base)

        "$TOOL/.build/debug/flexview" "${ARGS[@]}"

        echo "report=$OUT/report.html" >> "$GITHUB_OUTPUT"

        # Images have to live somewhere with a public URL for a comment to show them:
        # a workflow artifact is a zip behind auth and cannot be linked to.
        if [ -n "${{ inputs.s3-bucket }}" ]; then
          PUBLISH=(
            publish
            --report "$OUT/diff/report.json"
            --bucket "${{ inputs.s3-bucket }}"
            --region "${{ inputs.s3-region }}"
            --prefix "${{ inputs.s3-prefix }}"
            --repository "$GITHUB_REPOSITORY"
            --commit "${{ github.event.pull_request.head.sha }}"
            --html "$OUT/report.html"
          )
          [ -n "${{ github.event.pull_request.number }}" ] && PUBLISH+=(--pr "${{ github.event.pull_request.number }}")
          [ -n "${{ inputs.s3-endpoint }}" ] && PUBLISH+=(--endpoint "${{ inputs.s3-endpoint }}")
          [ -n "${{ inputs.s3-public-base-url }}" ] && PUBLISH+=(--public-base-url "${{ inputs.s3-public-base-url }}")
          "$TOOL/.build/debug/flexview" "${PUBLISH[@]}"
        fi

        "$TOOL/.build/debug/flexview" comment \
          --report "$OUT/diff/report.json" \
          --artifact-name "${{ inputs.artifact-name }}" \
          --artifact-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --out "$OUT/comment.md"

        # The job summary is the version nobody has to download.
        cat "$OUT/comment.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ runner.temp }}/flexview/report.html
          ${{ runner.temp }}/flexview/diff/report.json
        if-no-files-found: warn

    # A pull request from a fork gets a read-only token, so commenting would fail. The
    # artifact and the job summary are still produced, which is why this only skips the
    # comment rather than failing the job.
    - name: Comment on the pull request
      if: >
        inputs.comment == 'true' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        "$GITHUB_WORKSPACE/.flexview-tool/.build/debug/flexview" comment \
          --report "${{ runner.temp }}/flexview/diff/report.json" \
          --pr "${{ github.event.pull_request.number }}" \
          --artifact-name "${{ inputs.artifact-name }}" \
          --artifact-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

    - name: Note skipped comment
      if: >
        inputs.comment == 'true' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository
      shell: bash
      run: |
        echo "::notice::Pull requests from forks get a read-only token, so no comment was posted. The report is attached as the '${{ inputs.artifact-name }}' artifact and repeated in this job's summary."
